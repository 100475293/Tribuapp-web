<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Únete a TribuApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F0FDF4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 90%;
    }
    .icon { font-size: 64px; margin-bottom: 12px; }
    h1 { font-size: 28px; font-weight: 800; color: #111827; margin-bottom: 6px; }
    .tagline { color: #10B981; font-size: 14px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }
    .subtitle { color: #6B7280; font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      display: block;
      background: #10B981;
      color: white;
      padding: 18px 24px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(16,185,129,0.35);
      cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .divider { color: #D1D5DB; font-size: 13px; margin-bottom: 20px; }
    .code-box {
      background: #F9FAFB;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #E5E7EB;
    }
    .code-label { font-size: 12px; color: #9CA3AF; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .code { font-size: 26px; font-weight: 800; color: #111827; letter-spacing: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏠</div>
    <h1>TribuApp</h1>
    <p class="tagline">Organización familiar</p>
    <p class="subtitle">Te han invitado a unirte<br>a una familia en TribuApp</p>
    <a id="openBtn" class="btn" href="#">👉 Abrir TribuApp</a>
    <p class="divider">— o si no tienes la app —</p>
    <div class="code-box">
      <p class="code-label">Usa este código en la app:</p>
      <p class="code" id="codeText">—</p>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code') || '';
    if (code) {
      document.getElementById('codeText').textContent = code;
      document.getElementById('openBtn').href = 'tribuapp://join?code=' + encodeURIComponent(code);
    } else {
      document.getElementById('codeText').textContent = 'Código no válido';
      document.getElementById('openBtn').style.display = 'none';
    }
  </script>
</body>
</html>
